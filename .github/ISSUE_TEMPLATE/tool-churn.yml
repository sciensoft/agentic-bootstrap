name: Tool schema churn
description: An agentic tool changed its settings format and the bootstrap's adapter is stale.
title: "[churn] "
labels: ["tool-churn"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template when one of the eight supported tools (Claude Code, Cursor, Aider, Codex CLI, OpenCode, Continue.dev, Windsurf, Copilot) has changed its config schema or permission model in a way that breaks — or simply outdates — the adapter template the bootstrap writes.

        The more structured this is, the faster a PR can land. The fields below mirror what the fix needs.

  - type: dropdown
    id: tool
    attributes:
      label: Which tool changed?
      options:
        - Claude Code
        - Cursor
        - Aider
        - OpenAI Codex CLI
        - OpenCode
        - Continue.dev
        - Windsurf
        - GitHub Copilot
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Tool version where the change appeared
      placeholder: "e.g. Cursor 0.5.0, Aider 0.20.0"
    validations:
      required: true

  - type: textarea
    id: before
    attributes:
      label: What the bootstrap currently writes (or what stopped working)
      description: Paste the adapter file contents or name the failing field.
      render: text
    validations:
      required: true

  - type: textarea
    id: after
    attributes:
      label: What the new schema expects
      description: Paste the corrected snippet, or link to the tool's release notes.
      render: text
    validations:
      required: true

  - type: input
    id: source
    attributes:
      label: Source for the change
      description: Release notes, docs page, commit, blog post — wherever the new behaviour is documented.
      placeholder: "https://..."

  - type: textarea
    id: notes
    attributes:
      label: Anything else?
      description: Backwards-compat notes, posture-specific quirks, related fields that also moved.
