name: lint-bootstrap

# Runs scripts/lint_bootstrap.py on every PR and on pushes to the main
# branches. Runs unconditionally (no paths filter) so the check always
# reports a status — required by the develop branch protection ruleset,
# which would block PRs with "Waiting for status" if the workflow were
# path-filtered and the PR touched none of the watched files.
# See scripts/lint_bootstrap.py for the four checks.

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run consistency lint
        run: python scripts/lint_bootstrap.py
