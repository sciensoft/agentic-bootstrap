<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>Agentic Bootstrap</title>
  <defs>
    <linearGradient id="ab-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="55%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="ab-shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Rounded violet pill — matches the landing-page brand mark -->
  <rect width="32" height="32" rx="7.5" ry="7.5" fill="url(#ab-grad)"/>
  <!-- Subtle top-edge glass highlight for depth -->
  <rect width="32" height="32" rx="7.5" ry="7.5" fill="url(#ab-shine)"/>

  <!-- Geometric "A" with triangular negative space; evenodd cuts the inner triangle -->
  <path fill-rule="evenodd" fill="#0a0a0b"
        d="M 16 6 L 26 26 L 22.4 26 L 20.4 22 L 11.6 22 L 9.6 26 L 6 26 Z
           M 13.4 19 L 18.6 19 L 16 13.8 Z"/>
</svg>
